# Production settings (spec stack §10.1), mounted by docker-compose.prod.yml.
# Anything not set here keeps the PostgreSQL default.

listen_addresses = '*' # the internal network only: no port is published
max_connections = 20 # the API pool (10), migrate, backups and a psql by hand
shared_buffers = 128MB # within the container's 512 MiB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB

password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'

# To docker logs, rotated by the json-file driver.
log_destination = 'stderr'
log_min_duration_statement = 1000 # ms: slow queries only
log_parameter_max_length = 0 # never their parameters (user content, spec stack §11)
log_parameter_max_length_on_error = 0
log_line_prefix = '%m [%p] %q%u@%d '
