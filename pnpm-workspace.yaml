packages:
  - apps/*
  - packages/*
  - e2e

# Every shared dependency version lives here once, referenced as `catalog:`.
catalog:
  '@inlang/paraglide-js': ^2.25.4
  '@playwright/test': ^1.63.0
  '@types/node': ^24.19.1
  '@vitest/browser-playwright': ^4.1.11
  hono: ^4.13.12
  oxlint: ^1.86.0
  oxlint-tsgolint: ^7.0.2003
  playwright: ^1.63.0
  prettier: ^3.9.9
  prettier-plugin-tailwindcss: ^0.8.1
  typescript: ^7.0.2
  vitest: ^4.1.11
  zod: ^4.6.5

# A release must be 7 days old before pnpm installs it (minutes).
minimumReleaseAge: 10080

# Explicit allowlist of dependencies whose install scripts may run.
allowBuilds:
  # The postinstall only checks the binary, already installed through its platform package.
  esbuild: false
strictDepBuilds: true
