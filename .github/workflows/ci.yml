name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── check-all : reproduit `pnpm check:all` (lint + type-check + tests backend
  #    + build extension + E2E Playwright frontend & extension) ────────────────
  check-all:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: battlecrm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d battlecrm"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # Node 24 : `node ace build` (déclenché par le webServer Playwright) exige
      # la détection TS native de Node ≥ 22.7, sinon ERR_UNKNOWN_FILE_EXTENSION.
      # C'est aussi la base des Dockerfiles (node:24-alpine).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # .env racine attendu par `node ace` et le webServer Playwright.
      # APP_KEY : secret CI_APP_KEY si défini, sinon généré à la volée (base éphémère).
      - name: Write CI .env
        run: |
          APP_KEY='${{ secrets.CI_APP_KEY }}'
          if [ -z "$APP_KEY" ]; then APP_KEY="$(openssl rand -base64 32)"; fi
          cat > .env <<EOF
          NODE_ENV=development
          APP_KEY=$APP_KEY
          APP_NAME=BattleCRM
          PORT=3333
          HOST=0.0.0.0
          LOG_LEVEL=info
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=battlecrm
          SESSION_DRIVER=cookie
          ALLOW_REGISTRATION=true
          GMAIL_USER=ci@battlecrm.test
          GMAIL_APP_PASSWORD=ci-dummy-password
          FRONTEND_URL=http://localhost:5173
          VITE_API_URL=http://localhost:3333/api
          VITE_APP_URL=http://localhost:5173
          E2E_TEST_ROUTES_ENABLED=true
          E2E_BASE_URL=http://localhost:5173
          E2E_API_URL=http://localhost:3333
          E2E_TEST_EMAIL=e2e-test@battlecrm.test
          E2E_TEST_PASSWORD=E2eTestPwd123!
          CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Run migrations
        run: cd apps/backend && ENV_PATH=../../ node ace migration:run --force

      # `migration:run` régénère apps/backend/database/schema.ts (fichier versionné)
      # en version non formatée → ferait planter `biome check`. Le schéma applique
      # les mêmes migrations : on restaure la version commitée (déjà formatée).
      - name: Restore generated schema.ts (formatting only)
        run: git checkout -- apps/backend/database/schema.ts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # check:all complet ; E2E extension nécessite un display → xvfb.
      - name: pnpm check:all (under xvfb)
        run: xvfb-run -a pnpm check:all

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # ── docker-build : build réel des images pour attraper les bugs de Dockerfile
  #    que check:all ne peut pas voir (cf CICD_AUDIT.md §2.7) ───────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: VITE_API_URL=/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
