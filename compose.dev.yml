# Local Postgres for development and tests: `docker compose -f compose.dev.yml up -d`.
# Development credentials only; the test harness creates its own database per run.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: battlecrm
      OWNER_PASSWORD: owner
      APP_PASSWORD: app
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./ops/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
